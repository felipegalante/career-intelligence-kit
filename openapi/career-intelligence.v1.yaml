openapi: 3.1.0
info:
  title: Career Intelligence API
  version: 1.0.0
  description: >
    Public contract for career-intelligence providers. Implemented by the private
    Rubric Compiler service and emulated by `@career-intelligence/mock-server`. The
    deterministic `@career-intelligence/local-engine` satisfies the same operations
    in-process. Every result carries `IntelligenceResultMetadata` so consumers can
    tell which provider produced it, whether it is degraded, the engine version, and
    any warnings.
  license:
    name: MIT
servers:
  - url: https://api.example.com
    description: Placeholder; configure per deployment.
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness/health for the provider.
      responses:
        "200":
          description: Health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerIntelligenceHealth"
  /v1/resumes/parse:
    post:
      operationId: parseResume
      summary: Parse raw resume text into a structured profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseResumeInput"
      responses:
        "200":
          description: Parsed resume + metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseResumeResult"
  /v1/jobs/normalize:
    post:
      operationId: normalizeJobDescription
      summary: Normalize a job description into a scoring profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NormalizeJobDescriptionInput"
      responses:
        "200":
          description: Normalized job profile + metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizeJobDescriptionResult"
  /v1/fit-score:
    post:
      operationId: scoreFit
      summary: Score resume↔job fit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreFitInput"
      responses:
        "200":
          description: Fit score result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FitScoreResult"
  /v1/evaluations:
    post:
      operationId: evaluate
      summary: Full evaluation (parsed resume + job profile + fit + strengths/gaps).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerEvaluationInput"
      responses:
        "200":
          description: Career evaluation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEvaluationResult"
  /v1/reports/resume-ats:
    post:
      operationId: generateResumeAtsReport
      summary: Generate a Resume ATS report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerEvaluationInput"
      responses:
        "200":
          description: Resume ATS report result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeAtsReportResult"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    IntelligenceResultMetadata:
      type: object
      required: [provider, mode, degraded, engineVersion, generatedAt, warnings]
      properties:
        provider: { type: string }
        mode: { type: string, enum: [local, remote] }
        degraded: { type: boolean }
        engineVersion: { type: string }
        configVersion: { type: string }
        scoringMode: { type: string }
        generatedAt: { type: string, format: date-time }
        requestId: { type: string }
        warnings:
          type: array
          items: { type: string }
        contractVersion: { type: string }
        careerIntelligenceContractVersion: { type: string }
        normalizerVersion: { type: string }
        scoringVersion: { type: string }
        rubricVersion: { type: string }
        companyIntelProvider: { type: string }
        companyIntelDegraded: { type: boolean }
        companyIntelWarnings:
          type: array
          items: { type: string }
    CareerIntelligenceHealth:
      type: object
      required: [status, provider, engineVersion, localFallbackOnly]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        provider: { type: string }
        engineVersion: { type: string }
        localFallbackOnly: { type: boolean }
    ResumeInput:
      type: object
      required: [text]
      properties:
        text: { type: string }
        filename: { type: string }
        locale: { type: string }
    JobDescriptionInput:
      type: object
      required: [text]
      properties:
        text: { type: string }
        title: { type: string }
        company: { type: string }
        locale: { type: string }
    ParseResumeInput:
      type: object
      required: [resume]
      properties:
        resume: { $ref: "#/components/schemas/ResumeInput" }
        requestId: { type: string }
    ParsedResume:
      type: object
      description: Structured resume profile. See @career-intelligence/types for the full shape.
      additionalProperties: true
    ParseResumeResult:
      type: object
      required: [resume, metadata]
      properties:
        resume: { $ref: "#/components/schemas/ParsedResume" }
        metadata: { $ref: "#/components/schemas/IntelligenceResultMetadata" }
    NormalizeJobDescriptionInput:
      type: object
      required: [job]
      properties:
        job: { $ref: "#/components/schemas/JobDescriptionInput" }
        requestId: { type: string }
    NormalizedJobProfile:
      type: object
      description: Normalized job scoring profile. See @career-intelligence/types.
      additionalProperties: true
    NormalizeJobDescriptionResult:
      type: object
      required: [job, metadata]
      properties:
        job: { $ref: "#/components/schemas/NormalizedJobProfile" }
        metadata: { $ref: "#/components/schemas/IntelligenceResultMetadata" }
    ScoreFitInput:
      type: object
      required: [resume, job]
      properties:
        resume: { $ref: "#/components/schemas/ResumeInput" }
        job: { $ref: "#/components/schemas/JobDescriptionInput" }
        requestId: { type: string }
    FitScoreResult:
      type: object
      required: [score, atsScore, matchLevel, verdict, dimensions, signals, calibration, metadata]
      properties:
        score: { type: number }
        atsScore: { type: number }
        matchLevel: { type: string, enum: [strong, good, fair, weak] }
        verdict: { type: string }
        dimensions:
          type: array
          items: { type: object, additionalProperties: true }
        signals:
          type: array
          items: { type: object, additionalProperties: true }
        calibration:
          type: array
          items: { type: object, additionalProperties: true }
        companyIntel: { $ref: "#/components/schemas/ReportCompanyIntel" }
        marketIntel: { $ref: "#/components/schemas/ReportMarketIntel" }
        result:
          type: object
          description: Engine-native lightweight result envelope (engine-specific fields).
          additionalProperties: true
        metadata: { $ref: "#/components/schemas/IntelligenceResultMetadata" }
    EvaluationCompanyContextInput:
      type: object
      description: Optional company/domain resolution hints for company intelligence.
      properties:
        companyName: { type: string }
        companyWebsite: { type: string }
        companyDomain: { type: string }
        countryOrRegion: { type: string }
        jobTitle: { type: string }
        jobDescriptionText: { type: string }
        preResolvedCompanyContext: { type: object, additionalProperties: true }
        companyContextMode: { type: string, enum: [remote, provided, disabled] }
    CareerEvaluationInput:
      type: object
      required: [resume, job]
      properties:
        resume: { $ref: "#/components/schemas/ResumeInput" }
        job: { $ref: "#/components/schemas/JobDescriptionInput" }
        companyContext: { $ref: "#/components/schemas/EvaluationCompanyContextInput" }
        requestId: { type: string }
    CareerEvaluationResult:
      type: object
      required: [parsedResume, jobProfile, fit, strengths, gaps, metadata]
      properties:
        parsedResume: { $ref: "#/components/schemas/ParsedResume" }
        jobProfile: { $ref: "#/components/schemas/NormalizedJobProfile" }
        fit: { $ref: "#/components/schemas/FitScoreResult" }
        strengths:
          type: array
          items: { type: object, additionalProperties: true }
        gaps:
          type: array
          items: { type: object, additionalProperties: true }
        evidenceGraph:
          type: object
          description: Engine-native evidence graph (engine-specific shape).
          additionalProperties: true
        fitInsights: { $ref: "#/components/schemas/ResumeAtsFitInsights" }
        companyIntel: { $ref: "#/components/schemas/ReportCompanyIntel" }
        marketIntel: { $ref: "#/components/schemas/ReportMarketIntel" }
        calibration: { $ref: "#/components/schemas/ReportCalibration" }
        companyContext: { $ref: "#/components/schemas/ReportCompanyContext" }
        metadata: { $ref: "#/components/schemas/IntelligenceResultMetadata" }
    ReportCompanyIntel:
      description: >
        Company intelligence payload (carried opaquely from the company-intelligence
        contract). Null when unresolved — never invented.
      type: object
      additionalProperties: true
      nullable: true
    ReportMarketIntel:
      description: Domain/market intelligence payload. Null when unresolved.
      type: object
      additionalProperties: true
      nullable: true
    ReportCalibration:
      type: object
      description: >
        How company-intelligence signals would adjust the deterministic score. The
        base rubric score stays authoritative; the calibrated score is disclosed
        alongside it, never silently substituted.
      required:
        [positiveSignals, negativeSignals, neutralSignals, netAdjustment, baseScore, calibratedScore, applied]
      properties:
        positiveSignals:
          type: array
          items: { type: object, additionalProperties: true }
        negativeSignals:
          type: array
          items: { type: object, additionalProperties: true }
        neutralSignals:
          type: array
          items: { type: object, additionalProperties: true }
        netAdjustment: { type: number }
        baseScore: { type: number }
        calibratedScore: { type: number }
        applied: { type: boolean }
    ReportCompanyContext:
      type: object
      description: Honest company/domain section — insights when available, degraded disclosure otherwise.
      required: [provider, degraded, preparationInsights, resumeTailoringAngles, warnings]
      properties:
        provider: { type: string }
        degraded: { type: boolean }
        preparationInsights:
          type: array
          items: {}
        resumeTailoringAngles:
          type: array
          items: {}
        warnings:
          type: array
          items: { type: string }
    ResumeAtsFitInsights:
      type: object
      description: The structured, render-ready report body. See @career-intelligence/types for full field shapes.
      required:
        [fitSummary, snapshot, scoreCards, strengths, gaps, roadmap, resumeEdits, interviewPrep, skillsAnalysis, applicationChecklist, targetRoleContext, evidenceReview]
      properties:
        fitSummary: { type: object, additionalProperties: true }
        snapshot: { type: object, additionalProperties: true }
        scoreCards: { type: object, additionalProperties: true }
        strengths:
          type: array
          items: { type: object, additionalProperties: true }
        gaps:
          type: array
          items: { type: object, additionalProperties: true }
        roadmap:
          type: array
          items: { type: object, additionalProperties: true }
        resumeEdits:
          type: array
          items: { type: object, additionalProperties: true }
        interviewPrep:
          type: array
          items: { type: object, additionalProperties: true }
        skillsAnalysis: { type: object, additionalProperties: true }
        applicationChecklist:
          type: array
          items: { type: object, additionalProperties: true }
        targetRoleContext: { type: object, additionalProperties: true }
        evidenceReview: { type: object, additionalProperties: true }
    ResumeAtsReportResult:
      type: object
      required:
        [fitScore, atsScore, readinessScore, matchLevel, verdict, fitInsights, companyIntel, marketIntel, calibration, companyContext, metadata]
      properties:
        fitScore: { type: number }
        atsScore: { type: number }
        readinessScore: { type: number }
        matchLevel: { type: string, enum: [strong, good, fair, weak] }
        verdict: { type: string }
        summary:
          type: object
          description: Engine-native summary envelope; products should render from fitInsights.
          additionalProperties: true
        fitInsights: { $ref: "#/components/schemas/ResumeAtsFitInsights" }
        companyIntel: { $ref: "#/components/schemas/ReportCompanyIntel" }
        marketIntel: { $ref: "#/components/schemas/ReportMarketIntel" }
        calibration: { $ref: "#/components/schemas/ReportCalibration" }
        companyContext: { $ref: "#/components/schemas/ReportCompanyContext" }
        artifacts:
          type: object
          description: Rendered report artifacts (e.g. a Markdown export).
          additionalProperties: true
        metadata: { $ref: "#/components/schemas/IntelligenceResultMetadata" }
security:
  - bearerAuth: []
